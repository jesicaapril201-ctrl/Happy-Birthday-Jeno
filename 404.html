<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script>
      var l = window.location;
      var pathSegments = l.pathname.split('/').filter(Boolean);
      var repo = pathSegments.length > 0 ? pathSegments[0] : '';
      if (l.hostname.endsWith('github.io')) {
        l.replace('/' + repo + '/docs/' + l.search + l.hash);
      } else {
        l.replace('/' + l.search + l.hash);
      }
    </script>
  </head>
  <body style="background:#0b1021;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;">
    <p>Memuat hadiah ulang tahun Spider-Man...</p>
  </body>
</html>
